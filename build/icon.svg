<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1E3C"/>
      <stop offset="0.55" stop-color="#101227"/>
      <stop offset="1" stop-color="#07080F"/>
    </linearGradient>

    <radialGradient id="tileGlow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#6C7BFF" stop-opacity="0.36"/>
      <stop offset="0.6" stop-color="#6C7BFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#6C7BFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ringBack" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#2BC6E8" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#6C7BFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#B15CFF" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="ringFront" x1="0" y1="0.2" x2="1" y2="0.9">
      <stop offset="0" stop-color="#35E0F0"/>
      <stop offset="0.48" stop-color="#6C7BFF"/>
      <stop offset="1" stop-color="#C061FF"/>
    </linearGradient>

    <radialGradient id="core" cx="0.34" cy="0.26" r="0.92">
      <stop offset="0" stop-color="#B9C4FF"/>
      <stop offset="0.28" stop-color="#7E8BFF"/>
      <stop offset="0.62" stop-color="#6248E6"/>
      <stop offset="1" stop-color="#3B1C86"/>
    </radialGradient>

    <radialGradient id="coreShade" cx="0.72" cy="0.78" r="0.72">
      <stop offset="0" stop-color="#0A0618" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#0A0618" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0A0618" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreSpec" cx="0.32" cy="0.22" r="0.3">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="satGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9BF6FF" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#35E0F0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#35E0F0" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#tile)"/>
  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#tileGlow)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="112.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="3"/>

  <!-- Starfield -->
  <g fill="#FFFFFF">
    <circle cx="96" cy="112" r="3.2" opacity="0.5"/>
    <circle cx="424" cy="150" r="2.4" opacity="0.36"/>
    <circle cx="392" cy="392" r="3" opacity="0.28"/>
    <circle cx="120" cy="404" r="2.2" opacity="0.34"/>
    <circle cx="330" cy="82" r="1.8" opacity="0.24"/>
    <circle cx="86" cy="268" r="1.8" opacity="0.2"/>
  </g>

  <!-- Orbit: back half -->
  <g transform="rotate(-28 256 256)">
    <path d="M 60 256 A 196 92 0 0 1 452 256"
          fill="none" stroke="url(#ringBack)" stroke-width="24" stroke-linecap="round"/>
  </g>

  <!-- Core -->
  <g filter="url(#softGlow)">
    <circle cx="256" cy="256" r="84" fill="url(#core)"/>
  </g>
  <circle cx="256" cy="256" r="84" fill="url(#coreShade)"/>
  <circle cx="256" cy="256" r="84" fill="url(#coreSpec)"/>
  <circle cx="256" cy="256" r="83" fill="none" stroke="#C7D6FF" stroke-opacity="0.28" stroke-width="2"/>
  <path d="M 197 315 a 84 84 0 0 0 118 -118" fill="none" stroke="#7CE9FF" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>

  <!-- Orbit: front half -->
  <g transform="rotate(-28 256 256)">
    <path d="M 452 256 A 196 92 0 0 1 60 256"
          fill="none" stroke="url(#ringFront)" stroke-width="24" stroke-linecap="round"/>
    <!-- Satellite riding the front arc -->
    <circle cx="130" cy="326" r="42" fill="url(#satGlow)"/>
    <circle cx="130" cy="326" r="17" fill="#D9FBFF"/>
    <circle cx="130" cy="326" r="17" fill="none" stroke="#35E0F0" stroke-width="3" stroke-opacity="0.8"/>
  </g>
</svg>
