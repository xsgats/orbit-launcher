appId: app.orbitlauncher.desktop
productName: Orbit Launcher
copyright: Copyright © 2026 Orbit Launcher

directories:
  buildResources: build
  output: release/${version}




files:
  - out/**/*
  - package.json
  - '!**/*.map'

extraResources:
  - from: resources
    to: .
    filter:
      - '**/*'

asar: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: OrbitLauncher-Setup-${version}.${ext}

  legalTrademarks: Not affiliated with Mojang Studios or Microsoft
  fileAssociations:
    - ext: orbitpack
      name: Orbit instance
      description: Orbit Launcher instance export
      icon: build/icon.ico
      role: Editor
    - ext: mrpack
      name: Modrinth modpack
      description: Modrinth modpack archive
      icon: build/icon.ico
      role: Editor
  protocols:
    - name: Orbit Launcher
      schemes: [orbit]

nsis:

  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Orbit Launcher
  menuCategory: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  uninstallDisplayName: Orbit Launcher ${version}
  displayLanguageSelector: false
  include: build/installer.nsh



publish:
  - provider: generic
    url: https://releases.orbitlauncher.app/win32-x64
    channel: latest

compression: maximum
removePackageScripts: true
